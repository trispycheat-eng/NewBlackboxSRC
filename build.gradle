buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }
}

// THIS IS THE MISSING PIECE: Defining the variables for the modules
ext {
    compileSdkVersion = 34
    minSdk = 24
    targetSdk = 34
    versionCode = 1
    versionName = "1.0"
    blackReflection = '1.1.8'
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
