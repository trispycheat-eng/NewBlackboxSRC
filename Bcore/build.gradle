apply plugin: 'com.android.library'

android {
    namespace 'com.samsung.android.security.core' 
    compileSdk rootProject.ext.compileSdkVersion
    
    // Forces the old NDK that supports the engine
    ndkVersion "21.4.7075529"

    aidlPackageWhiteList "android/app/IServiceConnection.aidl"
    aidlPackageWhiteList "android/accounts/IAccountManagerResponse.aidl"

    buildFeatures {
        aidl true
        prefab true
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdk
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        consumerProguardFiles "consumer-rules.pro"
        
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
    }
    
    testOptions {
        unitTests.returnDefaultValues = true
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", "RestrictedApi"
        textOutput "stdout"
        textReport false
        checkOnly "NewApi", "InlinedApi"
    }
}

dependencies {
    implementation "com.google.android.material:material:1.3.0"
    implementation "com.github.CodingGay.BlackReflection:core:${rootProject.ext.blackReflection}"
    annotationProcessor "com.github.CodingGay.BlackReflection:compiler:${rootProject.ext.blackReflection}"

    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
}
