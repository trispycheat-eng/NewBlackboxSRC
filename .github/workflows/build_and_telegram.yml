name: Build Trispy Space

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # THIS IS THE MAGIC SCRIPT: Renames packages in ALL source files & C++ JNI strings
    - name: Rename BlackBox to Samsung Security
      run: |
        echo "Replacing Java/Kotlin/XML package names..."
        find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/top\.niunaijun\.blackboxa/com.samsung.android.security/g' {} +
        find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/top\.niunaijun\.blackbox/com.samsung.android.security/g' {} +
        
        echo "Replacing C++ JNI native method registration strings..."
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/top\/niunaijun\/blackboxa/com\/samsung\/android\/security/g' {} +
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/top\/niunaijun\/blackbox/com\/samsung\/android\/security/g' {} +

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DeviceSecurity-APK
        path: app/build/outputs/apk/debug/app-debug.apk
