name: Build Trispy Space

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Rename BlackBox to Samsung Security
      run: |
        echo "Replacing package strings inside all source files (including AIDL)..."
        find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\.niunaijun\.blackboxa/com.samsung.android.security/g' {} +
        find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\.niunaijun\.blackbox/com.samsung.android.security/g' {} +
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/top\/niunaijun\/blackboxa/com\/samsung\/android\/security/g' {} +
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/top\/niunaijun\/blackbox/com\/samsung\/android\/security/g' {} +
        
        echo "Replacing library loader name..."
        find . -type f -name "*.java" -exec sed -i 's/loadLibrary("blackbox")/loadLibrary("system_util")/g' {} +
        find . -type f -name "*.java" -exec sed -i 's/loadLibrary("blackboxa")/loadLibrary("system_util")/g' {} +
        
        echo "Moving Java folders to match new package name..."
        if [ -d "Bcore/src/main/java/top" ]; then
          mkdir -p Bcore/src/main/java/com/samsung/android
          mv Bcore/src/main/java/top/niunaijun/blackbox Bcore/src/main/java/com/samsung/android/security
          rm -rf Bcore/src/main/java/top
        fi
        if [ -d "app/src/main/java/top" ]; then
          mkdir -p app/src/main/java/com/samsung/android
          mv app/src/main/java/top/niunaijun/blackboxa app/src/main/java/com/samsung/android/security
          rm -rf app/src/main/java/top
        fi

        echo "Moving AIDL folders to match new package name..."
        if [ -d "Bcore/src/main/aidl/top" ]; then
          mkdir -p Bcore/src/main/aidl/com/samsung/android
          mv Bcore/src/main/aidl/top/niunaijun/blackbox Bcore/src/main/aidl/com/samsung/android/security
          rm -rf Bcore/src/main/aidl/top
        fi

        echo "Fixing Resource Path issue..."
        mkdir -p app/src/main/res/layout
        if [ ! -f app/src/main/res/layout/activity_list.xml ]; then
          echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" />' > app/src/main/res/layout/activity_list.xml
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DeviceSecurity-APK
        path: app/build/outputs/apk/debug/app-debug.apk
